name: Déploiement GitHub Pages

# Déploie le site statique sur GitHub Pages à chaque push sur la branche par défaut.
# Il suffit d'activer Pages dans Settings → Pages → Source : "GitHub Actions".

on:
  push:
    branches: ["main", "claude/cycling-news-website-1rej40"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule exécution à la fois, sans annuler un déploiement en cours.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
