  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("lrc-toggle");
      if (btn) {
        btn.addEventListener("click", function () {
          var next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try { localStorage.setItem("lrc-theme", next); } catch (e) {}
        });
      }
      // Adresse e-mail assemblée à l'exécution (moins facile à récolter par les robots).
      var mail = ["larevuecycliste", "gmail.com"].join("@");
      document.querySelectorAll("[data-mailto]").forEach(function (a) {
        a.setAttribute("href", "mailto:" + mail);
      });
      var y = document.querySelector("[data-year]");
      if (y) y.textContent = new Date().getFullYear();
    })();
